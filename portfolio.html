<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlexDev — Développeur Frontend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --purple: #7C3AED;
      --purple-light: #c4b5fd;
      --black: #111111;
      --dark: #1a1a1a;
      --gray: #6b7280;
      --light-gray: #f9fafb;
      --white: #ffffff;
      --border: #e5e7eb;
    }

    html {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--white);
      color: var(--black);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(1.5rem, 5vw, 4rem);
      height: 68px;
    }

    .nav-logo {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--black);
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      list-style: none;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .nav-links a {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--gray);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--black);
    }

    .nav-links a.active {
      color: var(--purple);
    }

    .nav-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--black);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .nav-icon-btn:hover {
      background: var(--purple);
      transform: scale(1.08);
    }

    .nav-icon-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--white);
    }

    /* ── HERO ── */
    .hero {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      padding: 68px clamp(1.5rem, 5vw, 4rem) 0;
      max-width: 1280px;
      margin: 0 auto;
      gap: 2rem;
    }

    .hero-left {
      flex: 0 0 55%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding-right: 2rem;
    }

    .greeting {
      font-size: 1.0625rem;
      font-weight: 400;
      color: var(--gray);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .hero-heading {
      display: flex;
      flex-direction: column;
      line-height: 1.0;
      letter-spacing: -0.03em;
    }

    .hero-heading .line-purple {
      font-size: clamp(3.5rem, 7vw, 5.5rem);
      font-weight: 900;
      color: var(--purple);
    }

    .hero-heading .line-black {
      font-size: clamp(3.5rem, 7vw, 5.5rem);
      font-weight: 900;
      color: var(--black);
    }

    .hero-desc {
      font-size: clamp(1rem, 1.5vw, 1.125rem);
      font-weight: 400;
      color: var(--gray);
      line-height: 1.65;
      max-width: 480px;
    }

    .hero-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--black);
      color: var(--white);
      border: 2px solid var(--black);
    }

    .btn-primary:hover {
      background: var(--dark);
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: var(--black);
      border: 2px solid var(--black);
    }

    .btn-outline:hover {
      background: var(--black);
      color: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    /* ── HERO RIGHT / PHOTO ── */
    .hero-right {
      flex: 0 0 45%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-ring {
      position: relative;
      width: clamp(260px, 30vw, 380px);
      height: clamp(260px, 30vw, 380px);
      border-radius: 50%;
      border: 2px solid var(--purple-light);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      filter: grayscale(100%);
      display: block;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .hero {
        flex-direction: column-reverse;
        align-items: center;
        text-align: center;
        padding-top: calc(68px + 2rem);
        padding-bottom: 3rem;
        gap: 3rem;
      }

      .hero-left {
        flex: unset;
        padding-right: 0;
        align-items: center;
      }

      .hero-right {
        flex: unset;
      }

      .nav-links {
        display: none;
      }

      .hero-desc {
        max-width: 540px;
      }

      .photo-ring {
        width: clamp(200px, 50vw, 280px);
        height: clamp(200px, 50vw, 280px);
      }
    }

    @media (max-width: 480px) {
      .hero-btns {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav aria-label="Navigation principale">
    <a href="#" class="nav-logo">AlexDev.</a>

    <ul class="nav-links" role="list">
      <li><a href="#" class="active" aria-current="page">Accueil</a></li>
      <li><a href="#projets">Projets</a></li>
      <li><a href="#a-propos">À propos</a></li>
    </ul>

    <button class="nav-icon-btn" aria-label="Menu contact">
      <!-- Envelope icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
      </svg>
    </button>
  </nav>

  <!-- HERO -->
  <main>
    <section class="hero" aria-label="Présentation">

      <div class="hero-left">
        <p class="greeting">Hé, je suis Alex <span aria-hidden="true">👋</span></p>

        <h1 class="hero-heading">
          <span class="line-purple">Développeur</span>
          <span class="line-black">Frontend</span>
        </h1>

        <p class="hero-desc">
          Je suis un développeur frontend basé en France, je vous aide à
          construire de beaux sites web que vos utilisateurs vont adorer.
        </p>

        <div class="hero-btns">
          <a href="#contact" class="btn btn-primary">Me Contacter</a>
          <a href="#projets" class="btn btn-outline">Voir mes Projets</a>
        </div>
      </div>

      <div class="hero-right">
        <div class="photo-ring">
          <img
            src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=400&fit=crop&crop=face"
            alt="Photo de profil d'Alex, développeur frontend"
            width="380"
            height="380"
          />
        </div>
      </div>

    </section>
  </main>

</body>
</html>
